name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: 构建
        run: go build ./...
      - name: 静态检查
        run: go vet ./...
      - name: 测试
        run: go test ./...
      # 端到端能覆盖到哪些 shell，取决于 runner 上装了什么。
      # bash 三个平台都有，zsh 只有 macOS 自带，pwsh 三个平台都有；
      # fish 需要自己装。
      - name: 安装 fish（用于真机验证 fish 集成）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
      - name: 端到端（真实 shell 里的 cd）
        if: runner.os != 'Windows'
        run: bash scripts/e2e.sh

  # 硬性约束 8：任何构建都必须能在关闭 cgo 的情况下交叉编译。
  crosscompile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: CGO_ENABLED=0 交叉编译
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: '0'
        run: go build ./cmd/jcd
